<!doctype html>
<html lang="zh-CN" data-ui="awesome-three-step-confirm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>确认演示文稿视觉风格</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <p class="eyebrow">AWESOME EDITABLE PPT</p>
      <h1>确认视觉风格</h1>
      <p>三步完成。模板只用于填写初始值，最终只保存你确认的视觉设置。</p>
    </header>

    <nav class="steps" aria-label="确认进度">
      <button type="button" data-step-target="1"><span>1</span>选择模板</button>
      <button type="button" data-step-target="2"><span>2</span>调整设置</button>
      <button type="button" data-step-target="3"><span>3</span>最终确认</button>
    </nav>

    <p id="error" class="error" role="alert" hidden></p>

    <section class="panel" data-step="1">
      <div class="panel-heading">
        <p class="eyebrow">STEP 1</p>
        <h2>选择一个起点</h2>
        <p>选择会更新下一步的默认值，但模板名称不会写入最终合同。</p>
      </div>
      <div id="templates" class="template-grid"></div>
      <footer class="actions"><span></span><button type="button" class="primary" data-action="next">下一步</button></footer>
    </section>

    <section class="panel" data-step="2" hidden>
      <div class="panel-heading">
        <p class="eyebrow">STEP 2</p>
        <h2>调整视觉设置</h2>
        <p>所有可保存的字段都在这里，没有页面材料或运行参数。</p>
      </div>
      <form id="visual-form" class="settings-grid">
        <label>主色<input name="primary_color" type="color" required></label>
        <label>辅助色<input name="secondary_color" type="color" required></label>
        <label>背景色<input name="background_color" type="color" required></label>
        <label>中文字体<input name="cjk_font" type="text" maxlength="120" required></label>
        <label>西文字体<input name="latin_font" type="text" maxlength="120" required></label>
        <label>标题字号（pt）<input name="title_size_pt" type="number" min="12" max="72" step="1" required></label>
        <label>正文字号（pt）<input name="body_size_pt" type="number" min="8" max="32" step="1" required></label>
        <label>图注字号（pt）<input name="caption_size_pt" type="number" min="8" max="24" step="1" required></label>
        <label class="wide">地区特征（可选）<textarea name="regional_characteristics" maxlength="500" rows="2"></textarea></label>
        <label class="wide">简短视觉描述<textarea name="visual_description" maxlength="500" rows="3" required></textarea></label>
      </form>
      <footer class="actions"><button type="button" data-action="back">返回</button><button type="button" class="primary" data-action="next">预览</button></footer>
    </section>

    <section class="panel" data-step="3" data-read-only="true" hidden>
      <div class="panel-heading">
        <p class="eyebrow">STEP 3</p>
        <h2>最终确认</h2>
        <p>此页只读。需要修改时可以返回上一步。</p>
      </div>
      <dl id="review" class="review-grid"></dl>
      <footer class="actions"><button type="button" data-action="back">返回修改</button><button type="button" class="primary" data-action="submit">确认并保存</button></footer>
    </section>

    <section id="done" class="panel done" hidden>
      <h2>视觉设置已确认</h2>
      <p>可以返回工作流继续生成演示文稿。</p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
