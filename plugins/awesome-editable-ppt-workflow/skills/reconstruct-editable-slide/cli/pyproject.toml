[project]
name = "image-to-editable-ppt-cli"
version = "0.3.0"
description = "Self-contained editppt CLI for the reconstruct-editable-slide skill."
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.0.0,<7",
  "pypdfium2>=4.30.0,<6",
  "Pillow>=10.0.0,<13",
  "PyYAML>=6.0.0,<7",
  "numpy>=1.26.0,<3",
  "requests>=2.31.0,<3",
  "python-pptx>=1.0.0,<2",
  "jsonschema>=4.0.0,<5",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
editppt = "editppt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editppt"]

[tool.hatch.build]
exclude = [
  "**/.DS_Store",
  "**/__pycache__",
]
