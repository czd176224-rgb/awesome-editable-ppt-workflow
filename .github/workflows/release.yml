name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'czd176224-rgb/awesome-editable-ppt-workflow'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare secure test root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $HOME ".codex") | Out-Null
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r plugins/awesome-editable-ppt-workflow/skills/run-word-to-ppt-workflow/requirements-dev.txt
      - name: Validate immutable tag and metadata
        shell: pwsh
        run: |
          $package = Get-Content -Raw package-info.json | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne $package.releaseTag) { throw "Tag must equal package releaseTag." }
          if ($package.releaseTag -ne ("v" + [string]$package.pluginVersion)) { throw "releaseTag must equal v<pluginVersion>." }
      - name: Complete release gate including Portable clean-install smoke
        shell: pwsh
        run: .\scripts\release_gate.ps1 -SkipOfficeTests
      - name: Package Windows release
        shell: pwsh
        run: .\scripts\package_release.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/* --generate-notes --title "Awesome Editable PPT Workflow $env:GITHUB_REF_NAME"
