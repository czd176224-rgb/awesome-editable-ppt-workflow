name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare secure test root
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path (Join-Path $HOME ".codex") | Out-Null
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r plugins/awesome-editable-ppt-workflow/skills/run-word-to-ppt-workflow/requirements-dev.txt
      - name: Complete bounded pull-request release gate
        shell: pwsh
        run: .\scripts\release_gate.ps1 -SkipPortableSmoke -SkipOfficeTests
